<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Keyword Text Inserter - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>Keyword Text Inserter</h1>
  <p class="hint">
    Each entry maps a <strong>keyword</strong> to a <strong>text passage</strong>.
    In the compose window you can replace all keywords in the email text with
    their passages, or pick a keyword from the dropdown to insert its passage
    at the cursor.
  </p>

  <div id="rows"></div>

  <div class="actions">
    <button id="addBtn" type="button">Add entry</button>
    <span id="status" role="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
